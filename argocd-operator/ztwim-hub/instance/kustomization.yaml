apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/redhat-cop/gitops-catalog/zero-trust-workload-identity-manager/instance/overlays/stable-v1

patches:
  - target:
      kind: SpireOIDCDiscoveryProvider
      group: operator.openshift.io
      version: v1alpha1
    patch: |-
      - op: replace
        path: /spec/jwtIssuer
        value: 'https://spire-spiffe-oidc-discovery-provider.apps.rosa.o8rzv-jyqnc-mnf.o468.p3.openshiftapps.com'
  - target:
      kind: ZeroTrustWorkloadIdentityManager
      group: operator.openshift.io
      version: v1alpha1
    patch: |-
      - op: replace
        path: /spec/trustDomain
        value: 'example.org'
  - target:
      kind: SpireServer
      group: operator.openshift.io
      version: v1alpha1
    patch: |-
      - op: replace
        path: /spec/jwtIssuer
        value: 'https://spire-spiffe-oidc-discovery-provider.apps.rosa.o8rzv-jyqnc-mnf.o468.p3.openshiftapps.com'
